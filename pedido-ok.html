<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pedido confirmado | ProyectoICT</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
  <link rel="stylesheet" href="styles.css" />
  <script defer src="app.js"></script>
</head>
<body>
<header class="header">
  <div class="container header-inner">
    <a class="logo" href="/" aria-label="Ir al inicio"><span>Proyecto ICT</span></a>
    <nav class="nav" aria-label="Navegación principal">
      <a href="/">Inicio</a>
      <a href="/#contacto">Contacto</a>
    </nav>
  </div>
</header>

<main class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div style="font-size:4rem">✅</div>
      <h1 class="fw-bold mt-3 mb-2">¡Pedido confirmado!</h1>
      <p class="lead text-muted mb-4">Hemos recibido tu pago correctamente. Recibirás un email de confirmación en breve.</p>
      <div class="alert alert-success text-start">
        <strong>¿Qué pasa ahora?</strong><br>
        Miguel Ángel Ribera se pondrá en contacto contigo en las próximas <strong>24 horas</strong> para coordinar el inicio del proyecto.
      </div>
      <a href="/" class="btn btn-primary px-4 mt-2">Volver al inicio</a>
    </div>
  </div>
</main>

<script>
  // Confirmar el pago en el backend
  const params = new URLSearchParams(window.location.search);
  const orderId = params.get('token') || params.get('order_id');
  if (orderId) {
    fetch('https://api.proyectoict.com/paypal-webhook', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ order_id: orderId })
    });
  }
</script>
</body>
</html>
