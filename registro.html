<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear cuenta | ProyectoICT</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
  <link rel="stylesheet" href="styles.css" />
  <script defer src="app.js"></script>
  <style>
    .auth-card { max-width: 480px; margin: 60px auto; background:#fff; border-radius:16px; padding:2.5rem; box-shadow:0 4px 32px rgba(0,0,0,.08); }
    .auth-logo { font-size:1.5rem; font-weight:700; color:#0d6efd; text-decoration:none; }
  </style>
</head>
<body style="background:#f8f9fa; min-height:100vh;">

<div class="auth-card">
  <div class="text-center mb-4">
    <a href="/" class="auth-logo">Proyecto ICT</a>
    <h1 class="h4 mt-3 mb-1 fw-bold">Crear cuenta</h1>
    <p class="text-muted small">Accede a tu área privada de cliente</p>
  </div>

  <div id="alert-box" class="alert d-none" role="alert"></div>

  <form id="registro-form" novalidate>
    <div class="row g-3">
      <div class="col-12">
        <label class="form-label fw-semibold">Nombre completo *</label>
        <input type="text" id="nombre" class="form-control" placeholder="Juan García López" required autocomplete="name" />
      </div>
      <div class="col-12">
        <label class="form-label fw-semibold">Email *</label>
        <input type="email" id="email" class="form-control" placeholder="tu@email.com" required autocomplete="email" />
      </div>
      <div class="col-12">
        <label class="form-label fw-semibold">Teléfono <span class="text-muted fw-normal">(opcional)</span></label>
        <input type="tel" id="telefono" class="form-control" placeholder="600 000 000" autocomplete="tel" />
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold">Contraseña *</label>
        <input type="password" id="password" class="form-control" placeholder="Mínimo 6 caracteres" required autocomplete="new-password" />
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold">Repetir contraseña *</label>
        <input type="password" id="password2" class="form-control" placeholder="••••••••" required autocomplete="new-password" />
      </div>
    </div>

    <div class="form-check mt-3">
      <input class="form-check-input" type="checkbox" id="acepto" required />
      <label class="form-check-label small text-muted" for="acepto">
        Acepto que mis datos se usen para gestionar mi cuenta y contactarme sobre mis proyectos ICT.
      </label>
    </div>

    <button type="submit" class="btn btn-primary btn-lg w-100 mt-4" id="btn-registro">
      <span id="btn-texto">Crear cuenta</span>
      <span id="btn-spinner" class="spinner-border spinner-border-sm ms-2 d-none"></span>
    </button>
  </form>

  <p class="text-center mt-3 small text-muted">
    ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
  </p>
  <div class="text-center mt-2">
    <a href="/" class="text-muted small">← Volver al inicio</a>
  </div>
</div>

<script>
  const API = 'https://api.proyectoict.com';

  if (localStorage.getItem('pict_token')) {
    window.location.href = 'area-cliente.html';
  }

  document.getElementById('registro-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const nombre   = document.getElementById('nombre').value.trim();
    const email    = document.getElementById('email').value.trim();
    const telefono = document.getElementById('telefono').value.trim();
    const password = document.getElementById('password').value;
    const password2 = document.getElementById('password2').value;
    const acepto   = document.getElementById('acepto').checked;
    const alertBox = document.getElementById('alert-box');
    const btn      = document.getElementById('btn-registro');
    const spinner  = document.getElementById('btn-spinner');

    alertBox.classList.add('d-none');

    if (!acepto) {
      alertBox.className = 'alert alert-warning';
      alertBox.textContent = 'Debes aceptar las condiciones para continuar.';
      alertBox.classList.remove('d-none');
      return;
    }
    if (password !== password2) {
      alertBox.className = 'alert alert-warning';
      alertBox.textContent = 'Las contraseñas no coinciden.';
      alertBox.classList.remove('d-none');
      return;
    }

    btn.disabled = true;
    spinner.classList.remove('d-none');

    try {
      const resp = await fetch(`${API}/auth/registro`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nombre, email, telefono, password })
      });
      const data = await resp.json();

      if (data.token) {
        localStorage.setItem('pict_token',  data.token);
        localStorage.setItem('pict_nombre', data.nombre);
        localStorage.setItem('pict_email',  data.email);
        window.location.href = 'area-cliente.html';
      } else {
        alertBox.className = 'alert alert-danger';
        alertBox.textContent = data.error || 'Error al crear la cuenta';
        alertBox.classList.remove('d-none');
        btn.disabled = false;
        spinner.classList.add('d-none');
      }
    } catch (err) {
      alertBox.className = 'alert alert-danger';
      alertBox.textContent = 'Error de conexión. Inténtalo de nuevo.';
      alertBox.classList.remove('d-none');
      btn.disabled = false;
      spinner.classList.add('d-none');
    }
  });
</script>
</body>
</html>
