<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso clientes | ProyectoICT</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
  <link rel="stylesheet" href="styles.css" />
  <script defer src="app.js"></script>
  <style>
    .auth-card { max-width: 440px; margin: 80px auto; background:#fff; border-radius:16px; padding:2.5rem; box-shadow:0 4px 32px rgba(0,0,0,.08); }
    .auth-logo { font-size:1.5rem; font-weight:700; color:#0d6efd; text-decoration:none; }
    .auth-logo:hover { color:#0a58ca; }
    .divider { text-align:center; color:#adb5bd; margin:1rem 0; font-size:.9rem; }
    .divider::before, .divider::after { content:''; display:inline-block; width:38%; height:1px; background:#dee2e6; vertical-align:middle; margin:0 .5rem; }
  </style>
</head>
<body style="background:#f8f9fa; min-height:100vh;">

<div class="auth-card">
  <div class="text-center mb-4">
    <a href="/" class="auth-logo">Proyecto ICT</a>
    <h1 class="h4 mt-3 mb-1 fw-bold">Acceso clientes</h1>
    <p class="text-muted small">Entra para ver tus pedidos y proyectos</p>
  </div>

  <div id="alert-box" class="alert d-none" role="alert"></div>

  <form id="login-form" novalidate>
    <div class="mb-3">
      <label class="form-label fw-semibold">Email</label>
      <input type="email" id="email" class="form-control form-control-lg" placeholder="tu@email.com" required autocomplete="email" />
    </div>
    <div class="mb-4">
      <label class="form-label fw-semibold">Contraseña</label>
      <input type="password" id="password" class="form-control form-control-lg" placeholder="••••••••" required autocomplete="current-password" />
    </div>
    <button type="submit" class="btn btn-primary btn-lg w-100" id="btn-login">
      <span id="btn-texto">Entrar</span>
      <span id="btn-spinner" class="spinner-border spinner-border-sm ms-2 d-none"></span>
    </button>
  </form>

  <div class="divider mt-4">¿No tienes cuenta?</div>
  <a href="registro.html" class="btn btn-outline-secondary w-100">Crear cuenta gratis</a>

  <div class="text-center mt-4">
    <a href="/" class="text-muted small">← Volver al inicio</a>
  </div>
</div>

<script>
  const API = 'https://api.proyectoict.com';

  // Si ya hay sesión, redirigir al área de cliente
  if (localStorage.getItem('pict_token')) {
    window.location.href = 'area-cliente.html';
  }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btnTexto  = document.getElementById('btn-texto');
    const spinner   = document.getElementById('btn-spinner');
    const alertBox  = document.getElementById('alert-box');
    const btn       = document.getElementById('btn-login');

    btn.disabled = true;
    spinner.classList.remove('d-none');
    alertBox.classList.add('d-none');

    try {
      const resp = await fetch(`${API}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await resp.json();

      if (data.token) {
        localStorage.setItem('pict_token',  data.token);
        localStorage.setItem('pict_nombre', data.nombre);
        localStorage.setItem('pict_email',  data.email);
        window.location.href = 'area-cliente.html';
      } else {
        alertBox.className = 'alert alert-danger';
        alertBox.textContent = data.error || 'Error al iniciar sesión';
        alertBox.classList.remove('d-none');
        btn.disabled = false;
        spinner.classList.add('d-none');
      }
    } catch (err) {
      alertBox.className = 'alert alert-danger';
      alertBox.textContent = 'Error de conexión. Inténtalo de nuevo.';
      alertBox.classList.remove('d-none');
      btn.disabled = false;
      spinner.classList.add('d-none');
    }
  });
</script>
</body>
</html>
